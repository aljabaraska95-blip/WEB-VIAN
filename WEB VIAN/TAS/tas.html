<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Toko Tas</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#333;
    }

    header{
      background:#111;
      color:white;
      padding:20px;
      text-align:center;
    }

    header h1{
      margin-bottom:5px;
    }

    .container{
      display:flex;
      justify-content:center;
      gap:20px;
      padding:40px 20px;
      flex-wrap:wrap;
    }

    .card{
      background:white;
      width:250px;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card img{
      width:100%;
      height:220px;
      object-fit:cover;
    }

    .content{
      padding:15px;
      text-align:center;
    }

    .content h2{
      margin-bottom:10px;
      font-size:20px;
    }

    .price{
      color:#e63946;
      font-weight:bold;
      margin-bottom:15px;
    }

    button{
      background:#111;
      color:white;
      border:none;
      padding:10px 20px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#444;
    }

    footer{
      text-align:center;
      padding:20px;
      background:#111;
      color:white;
      margin-top:30px;
    }
  </style>
</head>
<body>

  <header>
    <h1>TAS MEREK TORCH</h1>
    <p>TAS BUATAN INDONESIA </p>
  </header>

  <div class="container">

    <div class="card">
      <img src="kashiba.jpeg" alt="Tas 1">
      <div class="content">
        <h2>Tas Kashiba</h2>
        <p class="price">Rp218.880</p>
      </div>
    </div>

    <div class="card">
      <img src="shibata.jpeg" alt="Tas 2">
      <div class="content">
        <h2>Tas Shibata</h2>
        <p class="price">Rp143.040</p>

      </div>
    </div>

    <div class="card">
      <img src="hamura.jpeg" alt="Tas 3">
      <div class="content">
        <h2>Hamura waist bag</h2>
        <p class="price">Rp142.400</p>

      </div>
    </div>

  </div>

  <footer>
    <a href="../index.html">BACK TO MENU</a>
  </footer>

</body>
</html>
